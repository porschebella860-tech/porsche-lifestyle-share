
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Porsche Lifestyle Share</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f7;
      color: #222;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .container {
      max-width: 440px;
      min-height: 100vh;
      margin: auto;
      padding: 32px 24px;
      background: #fff;
    }

    .brand {
      font-size: 12px;
      letter-spacing: 2px;
      color: #777;
    }

    h1 {
      margin-top: 32px;
      font-size: 24px;
      font-weight: 500;
    }

    .description {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.8;
      color: #666;
    }

    .status {
      margin-top: 36px;
      padding: 18px;
      background: #f5f5f5;
      font-size: 13px;
      line-height: 1.8;
    }

    .footer {
      margin-top: 40px;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="brand">PORSCHE LIFESTYLE</div>

    <h1>LINE 商品分享</h1>

    <p class="description">
      Porsche Lifestyle 商品資訊分享服務。
      可透過 LINE 將商品資料分享給指定好友或群組。
    </p>

    <div class="status">
      系統狀態：分享功能建置中
    </div>

    <div class="footer">
      Porsche Centre Taipei
    </div>
  </main>
</body>
</html>
